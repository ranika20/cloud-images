<!DOCTYPE html>
<html lang="en">
<head>      
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Images</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Upload to Cloud</h1>
        <p class="subtitle">Upload your images directly to AWS S3 bucket</p>
        
        <form id="uploadForm" enctype="multipart/form-data">
            <input type="file" name="image" id="imageInput" accept="image/*" required>
            
            <div id="previewContainer">
                <img id="imagePreview" src="" alt="Preview">
            </div>

            <input type="text" id="descriptionInput" placeholder="Add a short description..." maxlength="100" style="width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; box-sizing: border-box;">

            <div class="progress-container" id="progressContainer">
                <div class="progress-bar" id="progressBar">0%</div>
            </div>

            <button type="submit" id="uploadBtn">Upload Image</button>
        </form>
        <div id="message"></div>

        <hr style="border: 0; height: 1px; background: #e2e8f0; margin: 40px 0;">
        <h2>My Gallery</h2>
        <div id="gallery" class="gallery-grid">
            <p id="noImagesMessage" style="grid-column: 1 / -1; color: #64748b; font-style: italic;">No images in your gallery yet. Upload one!</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
